<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10211d">
  <title>SoVida</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10211d; color: #f3fbf5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 20% 5%, #315c48 0, transparent 55%), #10211d; }
    main { width: min(100%, 560px); padding: 48px 32px; text-align: center; border: 1px solid #ffffff20; border-radius: 24px; background: #ffffff08; box-shadow: 0 24px 80px #0006; }
    .mark { font-size: 32px; }
    h1 { margin: 18px 0 12px; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: .03em; }
    p { margin: 0; color: #c1d5c9; line-height: 1.7; }
    footer { margin-top: 32px; color: #8eaa99; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✿</div>
    <h1>SoVida</h1>
    <p>A new space is taking shape. Please check back soon.</p>
    <footer>© SoVida</footer>
  </main>
</body>
</html>
